# ============================================================
# Configuration PARTAGEE par tous les microservices clients
# du Config Server. Ce fichier est servi a TOUT service qui
# se connecte, quel que soit son spring.application.name.
# ============================================================

# --- Eureka : URL commune du registre de services ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- Actuator : endpoints utiles en dev pour verifier la sante ---
management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.health.show-details=always
