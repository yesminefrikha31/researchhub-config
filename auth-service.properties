# ============================================================
# Configuration specifique a auth-service
# Servi uniquement quand spring.application.name=auth-service
# ============================================================

server.port=8081

# --- Base de donnees ---
# Adapte selon ta config reelle (PostgreSQL, MySQL, etc.)
spring.datasource.url=jdbc:postgresql://localhost:5432/researchhub_auth
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate

# --- OAuth2 Resource Server (Keycloak) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/researchhub

# --- Logging ---
logging.level.com.researchhub=DEBUG
