server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/supervisiondb
    username: supervisionuser
    password: supervisionpass
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

logging:
  level:
    com.researchhub: DEBUG